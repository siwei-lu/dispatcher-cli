name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: dispatch-darwin-arm64
            runner: macos-latest
          - target: bun-darwin-x64
            artifact: dispatch-darwin-x64
            runner: macos-latest
          - target: bun-linux-x64
            artifact: dispatch-linux-x64
            runner: ubuntu-latest
          - target: bun-linux-arm64
            artifact: dispatch-linux-arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build src/index.ts --compile --target ${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
      - run: codesign --sign - --force dist/${{ matrix.artifact }}
        if: runner.os == 'macOS'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
